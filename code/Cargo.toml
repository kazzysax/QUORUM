[workspace]
resolver = "2"
members = ["contracts/common", "contracts/vault", "contracts/nft", "contracts/treasury", "contracts/dao", "contracts/market"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/YOUR_ORG/quorum"

[workspace.dependencies]
near-sdk = { version = "=5.30.1", default-features = false, features = ["wee_alloc"] }
near-contract-standards = "=5.30.1"
quorum-common = { path = "contracts/common" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
